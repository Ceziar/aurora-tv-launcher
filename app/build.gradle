plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.ceziar.aurora'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.ceziar.aurora"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
